user nginx;
worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    # Match the event-driven Linux comparison. This limit is per worker.
    worker_connections 65536;
    use epoll;
    multi_accept on;
}

stream {
    # NGINX stream proxies raw TCP here; no HTTP parsing/routing is configured.
    upstream backend_nodes {
        server backend1:9001;
        server backend2:9002;
        server backend3:9003;
    }

    server {
        listen 8080;
        proxy_pass backend_nodes;
        proxy_connect_timeout 2s;
        proxy_timeout 10m;
    }
}
