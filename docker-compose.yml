services:
  loadbalancer:
    build:
      context: .
      target: dev
    volumes:
      - .:/app
      - build_cache:/app/build
    ports:
      - "8080:8080"
    depends_on:
      - backend1
      - backend2
      - backend3
    networks:
      - lbnet
    # Will run manually during dev

  nginx-comparison:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8081:80"
    networks:
      - lbnet

  backend1:
    build:
      context: .
      target: dev
    volumes:
      - .:/app
      - build_cache:/app/build
    command: ["/app/build/dummy_backend", "9001"]
    networks:
      - lbnet

  backend2:
    build:
      context: .
      target: dev
    volumes:
      - .:/app
      - build_cache:/app/build
    command: ["/app/build/dummy_backend", "9002"]
    networks:
      - lbnet

  backend3:
    build:
      context: .
      target: dev
    volumes:
      - .:/app
      - build_cache:/app/build
    command: ["/app/build/dummy_backend", "9003"]
    networks:
      - lbnet

networks:
  lbnet:
    driver: bridge

volumes:
  build_cache:
